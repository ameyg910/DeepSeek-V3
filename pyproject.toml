
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-v3-from-scratch"
version = "0.1.0"
description = "A from-scratch implementation of a DeepSeek-V3-inspired language model"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6",
    "PyYAML>=6.0",
    "tokenizers>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "models*", "data*", "training*"]

